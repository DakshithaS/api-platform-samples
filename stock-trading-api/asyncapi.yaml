asyncapi: 2.0.0
info:
  title: Stock Prices API
  version: 1.0.0
  description: >
    A WebSocket API that exposes a Kafka broker for real-time stock price
    updates and alerts. Clients connect via WebSocket to publish and consume
    stock prices, and to receive system alerts.
servers:
  production:
    url: https://api.example.com
    protocol: http
    description: Production WebSocket server (backed by Kafka)
channels:
  prices:
    description: The channel for sending & receiving stock price details.
    publish:
      summary: Publish a stock price update
      description: >
        Clients can publish stock price updates to this channel. Messages are
        forwarded to the underlying Kafka topic.
      operationId: publishStockPrice
      message:
        $ref: '#/components/messages/StockPrice'
    subscribe:
      summary: Receive stock price updates
      description: >
        Clients can subscribe to this channel to receive real-time stock price
        updates consumed from the underlying Kafka topic.
      operationId: receiveStockPrice
      message:
        $ref: '#/components/messages/StockPrice'
  alerts:
    description: The channel for receiving alerts.
    subscribe:
      summary: Receive system alerts
      description: >
        Clients can subscribe to this channel to receive real-time alerts,
        such as circuit breaker events, trading halts, or system notices.
      operationId: receiveAlert
      message:
        $ref: '#/components/messages/Alert'
components:
  messages:
    StockPrice:
      name: StockPrice
      title: Stock Price
      summary: Represents a stock price update for a given ticker symbol.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/StockPricePayload'
    Alert:
      name: Alert
      title: Alert
      summary: Represents a system or market alert.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/AlertPayload'
  schemas:
    StockPricePayload:
      type: object
      required:
        - ticker
        - price
        - timestamp
      properties:
        ticker:
          type: string
          description: The stock ticker symbol (e.g. AAPL, GOOG).
          example: AAPL
        price:
          type: number
          format: double
          description: The current price of the stock in USD.
          example: 189.45
        change:
          type: number
          format: double
          description: Price change since the previous close.
          example: 2.35
        changePercent:
          type: number
          format: double
          description: Percentage change since the previous close.
          example: 1.26
        volume:
          type: integer
          format: int64
          description: Number of shares traded.
          example: 1482300
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the price was recorded.
          example: "2026-05-22T14:32:00Z"
    AlertPayload:
      type: object
      required:
        - alertId
        - type
        - message
        - timestamp
      properties:
        alertId:
          type: string
          format: uuid
          description: Unique identifier for this alert.
          example: "a3bb189e-8bf9-3888-9912-ace4e6543002"
        type:
          type: string
          description: The category of alert.
          enum:
            - TRADING_HALT
            - CIRCUIT_BREAKER
            - MARKET_OPEN
            - MARKET_CLOSE
            - SYSTEM_NOTICE
          example: TRADING_HALT
        message:
          type: string
          description: Human-readable description of the alert.
          example: "Trading halted for AAPL pending news announcement."
        ticker:
          type: string
          description: The ticker symbol this alert relates to, if applicable.
          example: AAPL
        severity:
          type: string
          description: Severity level of the alert.
          enum:
            - INFO
            - WARNING
            - CRITICAL
          example: WARNING
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the alert was issued.
          example: "2026-05-22T14:35:00Z"
